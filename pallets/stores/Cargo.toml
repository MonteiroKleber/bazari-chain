[package]
name = "pallet-stores"
version = "0.1.0"
description = "Bazari minimal stores pallet: create_store and update_metadata"
authors = ["Bazari Team"]
edition = "2021"
license = "MIT-0"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
frame-support = { version = "40.1.0", default-features = false }
frame-system = { version = "40.1.0", default-features = false }
pallet-uniques = { version = "40.1.0", default-features = false }
sp-runtime = { version = "41.1.0", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-uniques/std",
]

[dev-dependencies]
sp-core = { version = "36.1.0", default-features = false, features = ["std"] }
pallet-balances = { version = "41.1.0", default-features = false, features = ["std"] }
sp-io = { version = "40.0.1", default-features = false, features = ["std"] }
